name: QueenX CI

on:
  push:
    branches: [main, master, develop, feature/**]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ========================================================================
  # Job 1: SAFETY 注释 + unsafe 分布审计 (基于 grep/python 脚本)
  # ========================================================================
  audit-unsafe:
    name: SAFETY 注释 + unsafe 分布审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 SAFETY 注释审计
        run: |
          echo "=== Step 1: SAFETY 注释审计 (M6.1) ==="
          python3 scripts/audit_safety_coverage.py --missing-only 2>&1 | tee build/log/safety_audit.txt
          echo ""
          echo "=== Step 2: services→framework 边界渗透检查 (M6.3) ==="
          python3 scripts/audit_services_boundary.py 2>&1 | tee build/log/services_boundary.txt
          echo ""
          echo "=== Step 3: 死锁检测矩阵 (M6.2) ==="
          python3 scripts/audit_deadlock_matrix.py 2>&1 | tee build/log/deadlock_matrix.txt
          if grep -q "CRITICAL" build/log/deadlock_matrix.txt; then
            echo "::error::检测到 CRITICAL 级别死锁风险, 请修复"
            exit 1
          fi

      - name: 上传审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            build/log/safety_audit.txt
            build/log/services_boundary.txt
            build/log/deadlock_matrix.txt
            docs/architecture/services-boundary.json
          retention-days: 30

  # ========================================================================
  # Job 2: services 层 unsafe 字符串扫描 (强约束)
  # ========================================================================
  services-no-unsafe:
    name: services 层 0 unsafe 扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 扫描 services/ 中 unsafe 关键字 (Python 智能过滤注释)
        run: |
          python3 <<'PYEOF'
          import re, sys
          from pathlib import Path
          issues = []
          for f in Path('src/kernel/services').rglob('*.rs'):
              for ln, line in enumerate(f.read_text(errors='replace').splitlines(), 1):
                  stripped = line.strip()
                  if stripped.startswith('//') or stripped.startswith('*') or stripped.startswith('/*'):
                      continue
                  if re.search(r'\bunsafe\s*\{', line):
                      issues.append(f'{f}:{ln}: unsafe {{ block: {line.strip()[:80]}')
                  elif re.search(r'\bunsafe\s+fn\b', line):
                      issues.append(f'{f}:{ln}: unsafe fn: {line.strip()[:80]}')
                  elif re.search(r'\bunsafe\s+impl\b', line):
                      issues.append(f'{f}:{ln}: unsafe impl: {line.strip()[:80]}')
                  elif re.search(r'\bunsafe\s+trait\b', line):
                      issues.append(f'{f}:{ln}: unsafe trait: {line.strip()[:80]}')
          if issues:
              for i in issues: print('  ' + i)
              print('FAIL: unsafe found in services/')
              sys.exit(1)
          print('PASS: services/ 0 unsafe')
          PYEOF

  # ========================================================================
  # Job 3: cargo check (编译验证)
  # ========================================================================
  cargo-check:
    name: cargo check (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: cargo check
        working-directory: src/rust
        run: |
          cargo check --target x86_64-unknown-none 2>&1 | tee build/log/cargo_check.txt
          if grep -q "error\[" build/log/cargo_check.txt; then
            echo "::error::cargo check 失败"
            exit 1
          fi

  # ========================================================================
  # Job 4: cargo check (aarch64)
  # ========================================================================
  cargo-check-aarch64:
    name: cargo check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + aarch64 target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none
          components: rust-src

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: cargo check
        working-directory: src/rust
        run: |
          cargo check --target aarch64-unknown-none 2>&1 | tee build/log/cargo_check_aarch64.txt
          if grep -q "error\[" build/log/cargo_check_aarch64.txt; then
            echo "::error::cargo check 失败"
            exit 1
          fi

  # ========================================================================
  # Job 5: 框内核合规性总报告
  # ========================================================================
  framekernel-compliance:
    name: 框内核合规性总报告
    runs-on: ubuntu-latest
    needs: [audit-unsafe, services-no-unsafe, cargo-check, cargo-check-aarch64]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: 生成合规性报告
        if: needs.audit-unsafe.result == 'success' && needs.services-no-unsafe.result == 'success' && needs.cargo-check.result == 'success' && needs.cargo-check-aarch64.result == 'success'
        run: |
          cat <<'EOF' > $GITHUB_STEP_SUMMARY
          # 🎉 QueenX 框内核合规性 PASS
          | 维度 | 状态 | 工具 |
          |------|------|------|
          | SAFETY 注释审计 | ✅ PASS | audit_safety_coverage.py |
          | services 边界检查 | ✅ PASS | audit_services_boundary.py |
          | 死锁检测矩阵 | ✅ PASS | audit_deadlock_matrix.py |
          | services 0 unsafe | ✅ PASS | grep scan |
          | x86_64 编译 | ✅ PASS | cargo check |
          | aarch64 编译 | ✅ PASS | cargo check |
          EOF
          echo "✅ 全部合规性检查通过"

      - name: 失败时报告
        if: needs.audit-unsafe.result != 'success' || needs.services-no-unsafe.result != 'success' || needs.cargo-check.result != 'success' || needs.cargo-check-aarch64.result != 'success'
        run: |
          cat <<'EOF' > $GITHUB_STEP_SUMMARY
          # ❌ 框内核合规性 FAIL
          | 维度 | 状态 | 工具 |
          |------|------|------|
          | SAFETY 注释审计 | $( [ "${{ needs.audit-unsafe.result }}" == "success" ] && echo "✅" || echo "❌" ) | audit_safety_coverage.py |
          | services 边界检查 | $( [ "${{ needs.audit-unsafe.result }}" == "success" ] && echo "✅" || echo "❌" ) | audit_services_boundary.py |
          | 死锁检测矩阵 | $( [ "${{ needs.audit-unsafe.result }}" == "success" ] && echo "✅" || echo "❌" ) | audit_deadlock_matrix.py |
          | services 0 unsafe | $( [ "${{ needs.services-no-unsafe.result }}" == "success" ] && echo "✅" || echo "❌" ) | grep scan |
          | x86_64 编译 | $( [ "${{ needs.cargo-check.result }}" == "success" ] && echo "✅" || echo "❌" ) | cargo check |
          | aarch64 编译 | $( [ "${{ needs.cargo-check-aarch64.result }}" == "success" ] && echo "✅" || echo "❌" ) | cargo check |
          EOF
          exit 1
