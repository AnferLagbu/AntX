[package]
name = "queenx_userland"
version = "0.1.0"
edition = "2021"
description = "QueenX 用户态 libc-like 子集 (Phase C3)"

[lib]
name = "queenx_userland"
crate-type = ["staticlib", "rlib"]

# userland 必须在裸金属上链接 (no_std, 自带 syscall 桩)
[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

# 跨架构: x86_64 (syscall) + aarch64 (svc) 共享 API
[target.'cfg(target_arch = "x86_64")'.dependencies]

[target.'cfg(target_arch = "aarch64")'.dependencies]
