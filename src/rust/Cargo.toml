[package]
name = "queenx"
version = "0.1.0"
edition = "2021"

[lib]
name = "queenx"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[dependencies]
spin = "0.9"
bitflags = "2.4"
smoltcp = { path = "../kernel/framework/net/smoltcp", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-dhcpv4",
    "proto-dns",
    "socket-raw",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }

[build-dependencies]

[features]
default = []
# 启用真实硬件 e1000 EEPROM 读取路径 (EERD 寄存器轮询).
# 关闭时 (默认) 走 QEMU 仿真兼容路径: 立即返回 0xFFFF, MAC 填入 QEMU 默认值.
# 真实硬件 (i210/i219/i211 等) 需要打开此 feature 才能读取 NIC EEPROM 中的真实 MAC.
e1000-real-hw = []
e1000-verbose = []
kernel_test = []
fault_injection = []
smp = []
net = []
alloc = []
async = []
lock_stats = []
debug_mutex = []
atomic_stats = []
log = []
json_export = []
ipv6 = []
dhcp = []
http_client = []
mdns = []
mqtt = []
sntp = []
smtp = []
tftp = []
snmp = []
netbios = []
preempt = []
kaslr = []
barrier = []

