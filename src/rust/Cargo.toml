[package]
name = "queenx"
version = "0.1.0"
edition = "2021"

[lib]
name = "queenx"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[dependencies]
spin = "0.9"
bitflags = "2.4"
smoltcp = { path = "../kernel/net/smoltcp", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-dhcpv4",
    "proto-dns",
    "socket-raw",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }

[build-dependencies]

[features]
default = []
e1000-verbose = []
kernel_test = []
fault_injection = []
smp = []
net = []
alloc = []
async = []
lock_stats = []
debug_mutex = []
atomic_stats = []
log = []
json_export = []
ipv6 = []
dhcp = []
http_client = []
mdns = []
mqtt = []
sntp = []
smtp = []
tftp = []
snmp = []
netbios = []

