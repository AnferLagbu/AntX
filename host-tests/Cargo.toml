[package]
name = "antx-host-tests"
version = "0.1.0"
edition = "2021"
description = "QueenX host-side unit tests"
authors = ["Anfer"]

[[test]]
name = "capability"
path = "src/capability.rs"

[[test]]
name = "checksum"
path = "src/checksum.rs"

[[test]]
name = "sha256"
path = "src/sha256.rs"

[[test]]
name = "buddy"
path = "src/buddy.rs"

[[test]]
name = "hvfs"
path = "src/hvfs_test.rs"

[[test]]
name = "hvfs_persist"
path = "src/persist_test.rs"

[[test]]
name = "iomem_alias"
path = "src/iomem_alias.rs"

[[test]]
name = "dma_stream"
path = "src/dma_stream.rs"

[[test]]
name = "framekernel_bench"
path = "src/framekernel_bench.rs"

[[bin]]
name = "framekernel-bench"
path = "src/bin/framekernel_bench.rs"

[dependencies]
bitflags = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
